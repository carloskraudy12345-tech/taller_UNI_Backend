# Nombre del workflow que aparecerá en la pestaña Actions de GitHub
name: CI/CD Pipeline

# Cuándo debe ejecutarse el workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Variables globales
env:
  NODE_VERSION: '20.x'  # versión de Node que usará GitHub Actions

# Definición de trabajos
jobs:

  # ======================================================
  # JOB 1: LINTING — Verificación de estilo/código
  # ======================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint


  # ======================================================
  # JOB 2: BUILD — Compilación del proyecto
  # ======================================================
  build:
    name: Build project
    runs-on: ubuntu-latest
    needs: lint   # Este job solo ejecuta si lint pasa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1


  # ======================================================
  # JOB 3: TESTING — Ejecución de tests unitarios
  # ======================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test -- --passWithNoTests

      - name: Run tests with coverage
        run: npm run test:cov -- --passWithNoTests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7


  # ======================================================
  # JOB 4: NOTIFICACIÓN FINAL (opcional)
  # ======================================================
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [test]
    if: always()

    steps:
      - name: Pipeline Completed
        run: echo "CI/CD Pipeline finalizado. Estado del deploy: ${{ needs.test.result }}"
